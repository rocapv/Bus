<VirtualHost *:80>
    # bus.pr1.es · la web de Bus en la RAÍZ de su propio nombre (06/11/2026; antes /EMT en la LAN).
    # Calcado de metro.pr1.es.conf.
    # Instalar en: /etc/apache2/sites-available/bus.pr1.es.conf
    #   sudo mkdir -p /var/www/bus.pr1.es/.well-known/acme-challenge
    #   sudo a2ensite bus.pr1.es && sudo systemctl reload apache2
    # El nombre lo mantiene el DDNS de Raspa (~/ddns_ovh/ddns_ovh.py, lista REGISTROS).
    ServerName bus.pr1.es

    # Reto ACME (Let's Encrypt) servido desde webroot, NO redirigir.
    Alias /.well-known/acme-challenge /var/www/bus.pr1.es/.well-known/acme-challenge
    <Directory /var/www/bus.pr1.es/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # Todo lo demás, a HTTPS: el token viaja en la URL y en la cookie.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://bus.pr1.es/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/bus.pr1.es-error.log
    CustomLog ${APACHE_LOG_DIR}/bus.pr1.es-access.log combined
</VirtualHost>
