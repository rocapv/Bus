<VirtualHost *:443>
    # bus.pr1.es · la web de Bus en la RAÍZ de su propio nombre (06/11/2026; antes /EMT en la LAN).
    # Calcado de metro.pr1.es-ssl.conf, con proxy al uvicorn de :8791.
    # Instalar en: /etc/apache2/sites-available/bus.pr1.es-ssl.conf
    #   (después de sacar el certificado:
    #    sudo certbot certonly --webroot -w /var/www/bus.pr1.es -d bus.pr1.es)
    #   sudo a2ensite bus.pr1.es-ssl && sudo systemctl reload apache2
    #
    # El acceso (token o no) lo decide la aplicación, no Apache: mira la IP real que Apache
    # añade a X-Forwarded-For.
    ServerName bus.pr1.es

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/bus.pr1.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bus.pr1.es/privkey.pem

    ProxyPreserveHost On

    # Aquí la aplicación cuelga de "/", no de "/EMT": la cookie del token tiene que
    # valer para toda la raíz (la aplicación solo la pone en "/" si ve esta cabecera).
    RequestHeader set X-Forwarded-Prefix "/"
    RequestHeader set X-Forwarded-Proto  "https"

    # /api/ ya tiene dueño: director-ocr.conf declara un <Location /api/> FUERA de todo vhost y
    # se llevaría el /api de TODOS los sitios a la API OCR del Director. Se le gana con otro
    # <Location /api/> dentro del vhost (un ProxyPass suelto no basta).
    <Location /api/>
        ProxyPass        http://127.0.0.1:8791/api/
        ProxyPassReverse http://127.0.0.1:8791/api/
    </Location>
    ProxyPass        / http://127.0.0.1:8791/
    ProxyPassReverse / http://127.0.0.1:8791/

    # Un año de HSTS, como home.pr1.es y metro.pr1.es (solo este nombre, sin includeSubDomains).
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/bus.pr1.es-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/bus.pr1.es-ssl-access.log combined
</VirtualHost>
