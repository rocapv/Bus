# Bus — proxy invers a uvicorn (127.0.0.1:8791) per a la LAN i la ruta heretada.
# La web pública és https://bus.pr1.es/ (deploy/bus.pr1.es*.conf). Ací:
#   - /bus/ : la mateixa web dins de la LAN (http://192.168.1.100/bus/).
#   - /EMT/ : la ruta d'EMTropello, que encara usa l'APK vella (home.pr1.es:5580 i
#             :8751, ports compartits amb Metroviolencia).
# Instal·lar a: /etc/apache2/conf-available/bus.conf
#   sudo a2disconf emtropello; sudo a2enconf bus && sudo systemctl reload apache2
# L'accés (token o no) el decideix l'aplicació (data/open_until.txt), com MetroViu.
<LocationMatch "^/(bus|EMT)/">
    <If "%{SERVER_PORT} -in { '5580', '8751' }">
        Require all granted
    </If>
    <Else>
        Require ip 192.168.1.0/24 127.0.0.1 ::1
    </Else>
</LocationMatch>

ProxyPreserveHost On
ProxyPass        /bus/ http://127.0.0.1:8791/
ProxyPassReverse /bus/ http://127.0.0.1:8791/
ProxyPass        /EMT/ http://127.0.0.1:8791/
ProxyPassReverse /EMT/ http://127.0.0.1:8791/

RedirectMatch permanent ^/bus$ /bus/
RedirectMatch permanent ^/EMT$ /EMT/
