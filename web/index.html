<!doctype html>
<html lang="ca-ES-valencia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Bus · busos d'EMT València en directe</title>
  <meta name="description" content="Els autobusos d'EMT València en directe, amb la seua posició GPS, el registre de cada parada i el recorregut de cada bus.">
  <meta name="theme-color" content="#0d0d12">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=202611061115">
</head>
<body>
  <div id="map"></div>

  <header id="hud">
    <button id="hud-toggle" title="Amaga/mostra el panell" aria-label="Amaga el panell">«</button>
    <div id="hud-body">
      <div class="titulo">
        <span class="dot-live"></span><span class="marca">BUS</span><span class="sub-marca">EMT València</span>
      </div>
      <div id="stats">carregant…</div>
      <label id="paradas-tog"><input type="checkbox" id="paradas-chk" checked> mostra les parades</label>
      <div id="paradas-hint">acosta el zoom per veure-les</div>
      <div class="ley-tit"><span>Línies <span id="ley-count"></span></span><button id="ley-totes" type="button" style="display:none">Totes</button></div>
      <div id="ley-hint">toca una línia per veure-la sola</div>
      <div id="leyenda"></div>
    </div>
  </header>

  <div id="reloj"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=202611061115"></script>
  <script src="xat.js?v=202611061115"></script>
  <script src="historia.js?v=202611061115"></script>
</body>
</html>
